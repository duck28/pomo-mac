# Builds Pomo.app and publishes it as a GitHub Release.
#
# Release:  git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3 (got $GITHUB_REF_NAME)"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test timer and progression
        run: ./test.sh

      - name: Build and ad-hoc sign app
        run: ./build.sh

      - name: Package (.zip and .dmg)
        run: |
          codesign --verify --deep --strict build/Pomo.app
          mkdir -p dist dmg
          ditto -c -k --sequesterRsrc --keepParent build/Pomo.app "dist/Pomo-$VERSION-macOS.zip"
          cp -R build/Pomo.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Pomo $VERSION" -srcfolder dmg -ov -format UDZO "dist/Pomo-$VERSION-macOS.dmg"
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Pomo for Mac ${{ github.ref_name }}
          files: dist/*
          body: |
            Pomo for Mac ${{ github.ref_name }} — macOS 14 or later (Apple silicon).

            Download `Pomo-${{ env.VERSION }}-macOS.zip` or open the `.dmg` and drag Pomo to Applications.
            The app is ad-hoc signed and not notarized yet: on first launch, open System Settings → Privacy & Security and click "Open Anyway" for Pomo.
